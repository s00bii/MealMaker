<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealMaker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">Loading…</div>
    <div class="background"></div>

    <div class="title">
        <h1>MealMaker</h1>
        <h3>By Subi</h3>
    </div>

    <button id="logoutBtn" class="logout-btn" onclick="logout()">Logout</button>

    

    <div class="overlay">
        <div class="fridge-panel">
            <h2>Your Fridges</h2>
            <div id="fridgeSlots"></div>
            <button id="addFridgeBtn" class="add-fridge-btn">+ Add Fridge</button>
        </div>

        <div class="right-column">
            <div class="get-recipes-container">
                <button id="getRecipesBtn" disabled>Get Recipes</button>
            </div>

            <div class="preferences">
                <h3>Recipe Preferences</h3>
                <label>
                    Min Calories:
                    <input type="number" id="calorieMin" value="200">
                </label>
                <label>
                    Max Calories:
                    <input type="number" id="calorieMax" value="1000">
                </label>
                <label>
                    Min Protein (g):
                    <input type="number" id="proteinMin" value="10">
                </label>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await requireLogin();
        });
    </script>
</body>
</html>
